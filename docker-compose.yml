services:
  mysql:
    image: mysql:8.4
    container_name: workforce-hub-mysql
    environment:
      MYSQL_DATABASE: workforce_hub
      MYSQL_USER: workforce
      MYSQL_PASSWORD: workforce_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  mysql_data:
